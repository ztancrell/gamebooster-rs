# Every push to main that changes the exe (see paths below): test, build gamebooster.exe, publish it to the rolling `latest` release
# (what `gamebooster update` downloads). Ubuntu + mingw cross-compile: the same toolchain as the
# local build, and the exe needs no Visual C++ runtime on the target machine.
name: release

on:
  push:
    branches: [main]
    # Only rebuild when something inside the exe changed (docs/decomp pushes don't).
    paths: [src/**, build.rs, Cargo.toml, Cargo.lock, capture/*.ps1, gamebooster.example.toml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true   # only the newest build matters

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung apt/cargo step once blocked the queue for over an hour
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Test
        run: cargo test

      - name: Build
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/gamebooster.exe gamebooster.exe

      - name: Publish to the `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(git log -1 --format='%h %s')"
          git tag -f latest
          git push -f origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "latest ($(git rev-parse --short HEAD))" --notes "$notes"
          else
            gh release create latest --title "latest ($(git rev-parse --short HEAD))" --notes "$notes"
          fi
          gh release upload latest gamebooster.exe --clobber
