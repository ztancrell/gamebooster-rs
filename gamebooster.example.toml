# gamebooster config. `gamebooster init` writes this file as gamebooster.toml next to gamebooster.exe; edit it there.
# Every tweak can be switched off on its own, so you can measure each one separately.
# See docs/tweaks/ for what each tweak does and how to measure it.

# Switch to the "gamebooster" power plan (copy of High performance) during a boost.
power_plan = true

# Maximum processor state (%) in that plan, plugged in and on battery. 100 = full speed with Turbo
# Boost. 99 = Turbo Boost off on Intel CPUs: lower peak clocks, but less heat and less thermal
# throttling on a hot MacBook Pro, often steadier frame times. Range 5-100.
max_processor_state = 100

# Minimum processor state (%) in that plan, 0-100, never above max_processor_state. Unset = 100:
# cores never clock down (lowest latency, most heat). If `gamebooster status` warns that the CPU is
# locked at 800 MHz (BD PROCHOT, see docs/tweaks/prochot.md), try the low-power combo:
#   min_processor_state = 5
#   max_processor_state = 99
# min_processor_state = 5

# Maximum processor frequency (MHz) in that plan, plugged in and on battery. Unset or 0 = no cap.
# Range 800-6000. Turbo Boost stays on up to the cap. If both this and max_processor_state < 100
# are set, the lower limit wins. On the 2019 16" MacBook Pro (Boot Camp), users who held the CPU
# at 2.6-3.0 GHz avoided the 800 MHz BD PROCHOT lock: as an alternative to max_processor_state = 99,
# try 2600-3000 with max_processor_state = 100 (Turbo allowed up to the cap) and compare.
# `gamebooster install` on a 16" MacBook Pro 2019 with the 5500M sets 1700 here (with its GPU power
# table that keeps CPU + GPU under the Mac's power budget in BF6); `uninstall` takes it out again.
# max_cpu_mhz = 2800

# Make sure Windows Game Mode is on (HKCU\Software\Microsoft\GameBar\AutoGameModeEnabled = 1).
game_mode = true

# Turn off the Sticky Keys (Shift x5), Filter Keys (hold Right Shift) and Toggle Keys (hold Num Lock)
# shortcuts while boosted, so they can't pop up mid-game. A feature you have switched on is left
# alone. Session only: restore (or signing out / rebooting) brings the shortcuts back.
accessibility_shortcuts_off = true

# On boost, time DNS lookups against your current DNS server and Cloudflare (1.1.1.1), Google
# (8.8.8.8) and Quad9 (9.9.9.9). If a public one is more than 10 ms and 20 % faster, use it on the
# active network adapter (IPv4) until restore. Faster lookups, not lower in-game ping.
# See docs/tweaks/network.md.
fastest_dns = false

# Hosts `gamebooster ping` measures. Default: these AWS regional endpoints (game servers are often
# hosted near cloud regions; this is an approximation, not BF6's own servers).
# ping_hosts = [
#   "dynamodb.us-east-1.amazonaws.com",
#   "dynamodb.us-west-1.amazonaws.com",
#   "dynamodb.us-west-2.amazonaws.com",
#   "dynamodb.ca-central-1.amazonaws.com",
#   "dynamodb.sa-east-1.amazonaws.com",
#   "dynamodb.eu-west-1.amazonaws.com",
#   "dynamodb.eu-west-2.amazonaws.com",
#   "dynamodb.eu-central-1.amazonaws.com",
#   "dynamodb.me-central-1.amazonaws.com",
#   "dynamodb.ap-northeast-1.amazonaws.com",
#   "dynamodb.ap-southeast-1.amazonaws.com",
#   "dynamodb.ap-southeast-2.amazonaws.com",
# ]

# Probes per host for `gamebooster ping` (TCP connects) and per hop for `gamebooster ping --route`
# (ICMP echoes). More samples catch more loss and jitter but take longer. 1 to 100.
ping_samples = 10

# Opt the running game out of Windows power throttling (EcoQoS) while boosted, so Windows can't slow
# it down when it's behind another window or on battery. Restore hands it back to Windows. Needs
# Windows 10 1709+. Applied with the game priority, so the game must be running (see [[game]]).
game_power_throttling_off = true

# Set Win32PrioritySeparation to 0x2A (short, fixed time slices, 3:1 boost for the window in front)
# while boosted; restore puts back the old value (or deletes it if there was none). Takes effect at
# once. Try by feel; false leaves it untouched. Windows default is 2.
priority_separation = true

# Trim the RAM of every non-game process once. Only useful when RAM is nearly full. Not undoable.
ram_trim = false

# Lower the CPU priority of your other apps (only ones running at Normal, owned by you) during the
# boost, so background bursts get out of the game's way. Restore puts each one back. Never touched:
# the games, apps in `close`, the shell and Windows session processes, audio, Discord, Steam, the EA
# app, anti-cheat, ThrottleStop, OBS, Defender and gamebooster (list: NEVER_LOWER in src/priority.rs).
lower_others = false
# "once" (default): the boost lowers them all, as above. "dynamic": the boost lowers nothing; while
# `gamebooster boost --watch` runs, only apps that keep the CPU busy are set to below normal, and
# back once they calm down or you switch to them (like Process Lasso's ProBalance; below normal only).
lower_others_mode = "once"
# below_normal (default) or idle (once mode only). Idle is what Smart Game Booster's (unused) code would set, but an idle app only runs
# when the CPU has nothing else to do, so voice chat, music or a stream can stutter while you play.
lower_others_class = "below_normal"
# With lower_others: also set each lowered app's disk (I/O) priority to Low (only ones at Normal),
# so a background updater or indexer doesn't compete with the game's disk reads. Restore puts it
# back. Apps that refuse (anti-cheat protected) are printed and skipped. Try by feel.
lower_others_io = true
# More apps to leave alone (image names as in Task Manager's Details tab), e.g. ["Spotify.exe"].
lower_others_exclude = []
# More publishers to leave alone: part of the CompanyName in the exe's Properties > Details tab,
# case-insensitive, e.g. ["Spotify"]. Built in: launchers, anti-cheat, GPU vendors, security
# software, OBS (list: NEVER_LOWER_PUBLISHERS in src/priority.rs).
# lower_others_exclude_publishers = []

# Services to stop during the boost (service *key* names, as `sc query` shows them, not the
# display names). Only listed services are touched: a service with a running dependent that isn't
# also listed is skipped. `--dry-run` shows what would stop.
# Empty by default: only add services you recognise. Suggestions:
#   "WSearch"    Windows Search indexing
#   "SysMain"    Superfetch / prefetching
#   "DiagTrack"  Connected User Experiences and Telemetry
#   "Spooler"    Print Spooler (if you don't print while playing)
#   "wuauserv"   Windows Update (it may start again by itself)
services = []

# Suggested list: Smart Game Booster's Windows 10/11 defaults, pruned of services that no longer
# exist (see docs/tweaks/services.md). Opt-in: to use it, delete `services = []` above and remove
# the leading "# " from every line of this block. Then drop what you need: "risky:" lines can break
# something during the session, "SGB default: off" lines SGB listed but didn't tick. Services that
# aren't installed or aren't running are skipped.
# services = [
#   "TrustedInstaller",   # risky: Windows Modules Installer; interrupts an update in progress
#   "TabletInputService", # risky: Touch Keyboard and Handwriting Panel; can break IME/text input
#   "StiSvc",             # Windows Image Acquisition (scanners, cameras)
#   "WMPNetworkSvc",      # Windows Media Player Network Sharing
#   "AxInstSV",           # ActiveX Installer
#   "ALG",                # Application Layer Gateway (ICS helper)
#   "AppMgmt",            # Application Management (Group Policy software installs)
#   "PeerDistSvc",        # BranchCache
#   "CertPropSvc",        # risky: Certificate Propagation; smart-card logon certificates
#   "WdiServiceHost",     # Diagnostic Service Host
#   "WdiSystemHost",      # Diagnostic System Host
#   "EFS",                # risky: Encrypting File System; EFS-encrypted files can't be opened
#   "Fax",                # Fax
#   "KtmRm",              # KtmRm for Distributed Transaction Coordinator
#   "lltdsvc",            # Link-Layer Topology Discovery Mapper (network map)
#   "swprv",              # risky: Software Shadow Copy Provider; interrupts a backup/restore point
#   "NetTcpPortSharing",  # Net.Tcp Port Sharing
#   "Netlogon",           # risky: Netlogon; domain logon/authentication on domain-joined PCs
#   "pla",                # Performance Logs & Alerts
#   "PNRPAutoReg",        # PNRP Machine Name Publication (peer networking)
#   "wercplsupport",      # Problem Reports Control Panel Support
#   "PcaSvc",             # Program Compatibility Assistant
#   "QWAVE",              # Quality Windows Audio Video Experience
#   "SessionEnv",         # Remote Desktop Configuration
#   "UmRdpService",       # Remote Desktop UserMode Port Redirector
#   "RpcLocator",         # Remote Procedure Call (RPC) Locator (legacy, not RpcSs)
#   "RemoteRegistry",     # Remote Registry
#   "RemoteAccess",       # Routing and Remote Access
#   "SCPolicySvc",        # risky: Smart Card Removal Policy; removing the card won't lock the PC
#   "SNMPTRAP",           # SNMP Trap
#   "StorSvc",            # Storage Service (storage settings, Store app installs)
#   "WebClient",          # WebDAV client
#   "WcsPlugInService",   # Windows Color System
#   "WerSvc",             # Windows Error Reporting
#   "Wecsvc",             # Windows Event Collector
#   "FontCache",          # risky: Windows Font Cache; slower font loading and app starts
#   "WinRM",              # Windows Remote Management
#   "W32Time",            # Windows Time (clock sync)
#   "DeviceInstall",      # risky: Device Install; devices plugged in during the session won't install
#   "DsmSvc",             # Device Setup Manager
#   "fhsvc",              # File History (pauses backups)
#   "vmickvpexchange",    # Hyper-V Data Exchange (guest only)
#   "vmicshutdown",       # Hyper-V Guest Shutdown (guest only)
#   "vmicheartbeat",      # Hyper-V Heartbeat (guest only)
#   "vmicrdv",            # Hyper-V Remote Desktop Virtualization (guest only)
#   "vmictimesync",       # Hyper-V Time Synchronization (guest only)
#   "vmicvss",            # Hyper-V Volume Shadow Copy Requestor (guest only)
#   "NcaSvc",             # Network Connectivity Assistant (DirectAccess)
#   "PrintNotify",        # Printer Extensions and Notifications
#   "svsvc",              # Spot Verifier (disk corruption checks)
#   "WiaRpc",             # Still Image Acquisition Events
#   "SystemEventsBroker", # risky: System Events Broker; core trigger broker for tasks and apps
#   "TimeBroker",         # risky: Time Broker; background tasks of Store apps
#   "bthserv",            # risky: Bluetooth Support; Bluetooth pads/headsets can drop. SGB default: off
#   "hidserv",            # risky: Human Interface Device Service; media/hot keys. SGB default: off
#   "DiagTrack",          # Connected User Experiences and Telemetry. SGB default: off
#   "MapsBroker",         # Downloaded Maps Manager. SGB default: off
#   "DPS",                # Diagnostic Policy Service. SGB default: off
#   "TrkWks",             # Distributed Link Tracking Client. SGB default: off
#   "SharedAccess",       # risky: Internet Connection Sharing; Mobile hotspot stops. SGB default: off
#   "MSiSCSI",            # Microsoft iSCSI Initiator. SGB default: off
#   "CscService",         # Offline Files. SGB default: off
#   "SSDPSRV",            # risky: SSDP Discovery; UPnP port mapping some games use. SGB default: off
#   "Themes",             # risky: Themes; visual style resets/flicker. SGB default: off
# ]

# Apps to close during the boost (image names, as in Task Manager's Details tab). They are started
# again on restore. Unsaved work in them is lost. Empty by default. Suggestions:
#   "OneDrive.exe", "Dropbox.exe", "iCloudServices.exe", "Teams.exe", "Spotify.exe"
# Launchers (EADesktop.exe, steam.exe), explorer.exe and Windows core processes are refused.
close = []

# How game priority is set:
#   "process"  (default) SetPriorityClass on the running game. Some anti-cheats (BF6's EA Javelin)
#              refuse it: boost then prints "could not set bf6.exe ... Access is denied".
#   "registry" writes HKLM\...\Image File Execution Options\<exe>\PerfOptions\CpuPriorityClass on
#              boost; Windows applies it when the game starts, so the anti-cheat never sees a
#              process access. Takes effect at the next game start (restart a running game).
#              Restore puts the registry back exactly. `gamebooster auto` writes it when auto
#              starts and keeps it until auto exits. Low but nonzero risk that an anti-cheat
#              objects to IFEO entries: watch for launch errors. realtime is not allowed here.
#              Recommended for games with a kernel anti-cheat such as BF6: verified there
#              (BF6 launches normally, Task Manager shows High).
# game_priority_method = "registry"

# `gamebooster auto`: seconds to wait after the last game exits before restoring. A game that starts
# again within this time keeps the boost (restart, launcher hand-off). 0 = restore at once.
# auto_restore_delay_secs = 30

# Games to raise in CPU priority while they run. Priority: realtime, high, above_normal, normal,
# below_normal, low. Use high; realtime can freeze input and audio.
[[game]]
# Battlefield 6. UNCERTAIN: bf6.exe is the expected name; check Task Manager's Details tab while
# the game runs and fix this line if it differs.
exe = "bf6.exe"
priority = "high"
